groups:
  - name: observability-platform-api
    rules:
      - alert: ObservabilityPlatformApiHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{application="observability-platform",uri=~"/api/v1/(incidents|dead-letters).*",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{application="observability-platform",uri=~"/api/v1/(incidents|dead-letters).*"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Observability Platform 运维接口错误率超过 5%"
          description: "Incident 或死信运维接口在最近 10 分钟持续出现较高的 5xx 错误率。"

      - alert: ObservabilityPlatformApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{application="observability-platform",uri=~"/api/v1/(incidents|dead-letters).*"}[5m])
            )
          ) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Observability Platform 运维接口 P95 延迟超过 1 秒"
          description: "Incident 或死信运维接口的 P95 响应时间在最近 10 分钟持续超过 1 秒。"

      - alert: ObservabilityPlatformRetentionFailure
        expr: |
          increase(observability_retention_runs_total{application="observability-platform",outcome="failed"}[15m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Observability Platform 数据清理失败"
          description: "至少一个数据保留目标在最近 15 分钟清理失败。"
