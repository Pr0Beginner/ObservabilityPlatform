# Spring Boot 基础配置。
spring:
  application:
    # 应用名称，用于日志标识、监控指标和服务识别。
    name: observability-platform
  jackson:
    # REST 响应序列化时忽略值为 null 的字段，减少无效输出。
    default-property-inclusion: non_null

  # Kafka 客户端配置，仅在 app.adapters.mode=external 时参与真实消息收发。
  kafka:
    # Kafka Broker 地址，可通过环境变量覆盖；多个地址使用逗号分隔。
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      # 本应用消费者所属的消费组。
      group-id: observability-platform
      # 新消费组没有已提交位点时，从最早的消息开始消费。
      auto-offset-reset: earliest

  # MySQL 的响应式数据库连接配置，仅供 external 模式下的 R2DBC Repository 使用。
  r2dbc:
    # 数据库连接地址、用户名和密码都应在部署环境中通过环境变量提供。
    url: ${DATABASE_URL:r2dbc:mysql://localhost:3306/observability?serverZoneId=UTC}
    username: ${DATABASE_USERNAME:observability}
    password: ${DATABASE_PASSWORD:observability}

  # WebFlux 单次在内存中缓冲请求或响应内容的上限。
  codec:
    max-in-memory-size: 10MB

# HTTP 服务配置。
server:
  # REST API 和 Actuator 监听端口。
  port: ${SERVER_PORT:8080}

# Spring Boot Actuator 运维端点配置。
management:
  prometheus:
    metrics:
      export:
        # 显式启用 Prometheus MeterRegistry；仅暴露端点不会自动创建该 Registry。
        enabled: true
  endpoints:
    web:
      exposure:
        # 对外暴露健康检查、应用信息和 Prometheus 指标。
        include: health,info,prometheus
  metrics:
    tags:
      # 为所有指标添加稳定的应用标签，便于同一 Prometheus 中区分不同系统。
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # 为 HTTP 请求生成耗时直方图，支持 Prometheus 计算接口 P95、P99 延迟。
        http.server.requests: true
      slo:
        # 为 HTTP 请求生成固定耗时桶，用于告警和服务等级目标统计。
        http.server.requests: 100ms,500ms,1s,3s

# 平台业务配置。
app:
  # REST API 身份认证与角色授权配置。
  security:
    # 生产环境应保持开启；仅无安全边界的本地测试可关闭。
    enabled: ${SECURITY_ENABLED:true}
    # 只读账号只能查询日志、链路、事件、诊断和死信。
    read-only:
      username: ${SECURITY_READ_ONLY_USERNAME:viewer}
      # 默认密码仅供本地启动，部署时必须通过环境变量替换。
      password: ${SECURITY_READ_ONLY_PASSWORD:viewer-local}
    # 运维账号可接入日志并处理事件、诊断和死信。
    operator:
      username: ${SECURITY_OPERATOR_USERNAME:operator}
      password: ${SECURITY_OPERATOR_PASSWORD:operator-local}
    # 管理员可管理异常策略、查看审计记录和访问管理指标。
    admin:
      username: ${SECURITY_ADMIN_USERNAME:admin}
      password: ${SECURITY_ADMIN_PASSWORD:admin-local}

  # 基础设施适配器选择。
  adapters:
    # local：内存存储和进程内调用，适合开发测试；external：使用 Kafka、MySQL 和 Elasticsearch。
    mode: ${ADAPTER_MODE:local}

  # MySQL 版本迁移配置，仅在 external 模式下启用；业务访问仍使用上方的 R2DBC 连接。
  migration:
    # 是否在应用启动时执行 Flyway 迁移。
    enabled: ${MIGRATION_ENABLED:true}
    # Flyway 使用 JDBC 执行 DDL，地址应指向与 R2DBC 相同的 MySQL 数据库。
    jdbc-url: ${MIGRATION_DATABASE_URL:jdbc:mysql://localhost:3306/observability?serverTimezone=UTC}
    username: ${MIGRATION_DATABASE_USERNAME:${DATABASE_USERNAME:observability}}
    password: ${MIGRATION_DATABASE_PASSWORD:${DATABASE_PASSWORD:observability}}
    # 仅旧 schema.sql 数据库首次接入 Flyway 时设为 true；新环境和完成接管后的生产环境保持 false。
    baseline-on-migrate: ${MIGRATION_BASELINE_ON_MIGRATE:false}

  # 日志接入限制。
  ingestion:
    # 单次批量接入允许包含的最大日志条数，超过后拒绝整个请求。
    max-batch-size: ${MAX_BATCH_SIZE:1000}

  # Diagnosis 诊断任务生命周期配置。
  diagnosis:
    # 诊断任务运行超过该时长后标记为超时，单位为分钟。
    timeout-minutes: ${DIAGNOSIS_TIMEOUT_MINUTES:10}
    # 扫描超时诊断任务的固定间隔，单位为毫秒。
    timeout-scan-delay-ms: ${DIAGNOSIS_TIMEOUT_SCAN_DELAY_MS:60000}

  # Incident 通知配置。
  notification:
    # 接收故障创建和恢复通知的 Webhook；为空时只记录通知日志，不发送 HTTP 请求。
    webhook-url: ${INCIDENT_WEBHOOK_URL:}
    # 重试发送失败通知的固定间隔，单位为毫秒。
    retry-delay-ms: ${NOTIFICATION_RETRY_DELAY_MS:60000}
    # 实例领取一条待发送通知后的独占时长，超时后允许其他实例接管，单位为秒。
    lease-seconds: ${NOTIFICATION_LEASE_SECONDS:120}
    # 单条通知允许的最大投递次数；耗尽后进入 EXHAUSTED，等待运维查询并按保留策略清理。
    max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:5}

  # 死信人工重放配置。
  dead-letter:
    # 单个实例领取死信后的独占时长；实例宕机或超时后其他实例可重新领取，单位为秒。
    replay-lease-seconds: ${DEAD_LETTER_REPLAY_LEASE_SECONDS:120}

  # MySQL 中高增长运行数据的保留与小批次清理配置。
  retention:
    # 是否启用定时清理；关闭后所有下列保留规则均不执行。
    enabled: ${RETENTION_ENABLED:true}
    # 清理任务 Cron，默认每小时第 15 分钟执行。
    cleanup-cron: ${RETENTION_CLEANUP_CRON:0 15 * * * *}
    # 指标窗口和对应 Trace 样本的基础保留天数。
    metric-window-days: ${RETENTION_METRIC_WINDOW_DAYS:7}
    # 在最长异常策略同比周期之外额外保留的安全时间，避免边界窗口提前删除。
    metric-baseline-safety-hours: ${RETENTION_METRIC_BASELINE_SAFETY_HOURS:24}
    # 已发送或已耗尽通知的保留天数；仍可重试的通知不会被清理。
    notification-days: ${RETENTION_NOTIFICATION_DAYS:90}
    # 已成功重放死信的保留天数。
    replayed-dead-letter-days: ${RETENTION_REPLAYED_DEAD_LETTER_DAYS:30}
    # 长期未处理死信的保留天数；到期后即使未重放也会删除，应按业务审计要求调整。
    unresolved-dead-letter-days: ${RETENTION_UNRESOLVED_DEAD_LETTER_DAYS:180}
    # 人工操作和权限拒绝审计记录的保留天数，应按组织合规要求调整。
    audit-days: ${RETENTION_AUDIT_DAYS:365}
    # 单条 DELETE 最多删除的记录数，限制事务规模和锁持有时间。
    batch-size: ${RETENTION_BATCH_SIZE:500}
    # 单个数据类型每轮最多执行的批次数，限制一次调度的工作量。
    max-batches-per-run: ${RETENTION_MAX_BATCHES_PER_RUN:20}

  # Incident 指标窗口和检测任务调度配置。
  # 业务阈值、同比周期、恢复窗口及启停状态由异常策略 API 管理，并持久化到 MySQL。
  incident:
    anomaly:
      # 请求指标统计窗口长度，单位为分钟；这是平台存储粒度，不属于单条业务策略。
      window-minutes: ${ANOMALY_WINDOW_MINUTES:5}
      # 扫描已完成指标窗口并执行异常检测的 Cron 表达式，默认每分钟执行一次。
      evaluation-cron: ${ANOMALY_EVALUATION_CRON:0 * * * * *}

  # Elasticsearch 日志存储配置，仅在 external 模式下使用。
  elasticsearch:
    # Elasticsearch 服务地址。
    url: ${ELASTICSEARCH_URL:http://localhost:9200}
    # 保存日志的 Data Stream 名称。
    data-stream: ${ELASTICSEARCH_DATA_STREAM:logs-observability-default}
    # Data Stream 使用的索引模板名称。
    template: ${ELASTICSEARCH_TEMPLATE:observability-logs-template}
    # Elasticsearch Data Stream Lifecycle 的日志保留时间。
    retention: ${ELASTICSEARCH_RETENTION:30d}

  # Diagnosis Agent 查询故障上下文时使用的 gRPC 服务配置。
  grpc:
    # 是否启动内嵌 gRPC 服务。
    enabled: ${GRPC_ENABLED:true}
    # gRPC 服务监听端口。
    port: ${GRPC_PORT:9090}

  # 平台使用的 Kafka 重试规则和 Topic 名称，仅在 external 模式下生效。
  kafka:
    retry:
      # 消费失败后的固定重试间隔，单位为毫秒。
      interval-ms: ${KAFKA_RETRY_INTERVAL_MS:1000}
      # 单条消息的最大处理次数，包含首次处理。
      max-attempts: ${KAFKA_RETRY_MAX_ATTEMPTS:3}
    topics:
      # 原始日志批次 Topic。
      logs-raw: logs.raw.v1
      # 平台向 Diagnosis Agent 发布诊断请求的 Topic。
      diagnosis-requested: diagnosis.requested.v1
      # Diagnosis Agent 向平台返回诊断结果的 Topic。
      diagnosis-completed: diagnosis.completed.v1

# 应用日志级别配置。
logging:
  level:
    # 本项目代码默认输出 INFO 及以上级别日志。
    org.zmy.observabilityplatform: INFO
