services:
  mysql:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    environment:
      MYSQL_DATABASE: observability
      MYSQL_USER: observability
      MYSQL_PASSWORD: observability
      MYSQL_ROOT_PASSWORD: observability-root
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "29092:29092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

  platform:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ADAPTER_MODE: external
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: r2dbc:mysql://mysql:3306/observability?serverZoneId=UTC
      DATABASE_USERNAME: observability
      DATABASE_PASSWORD: observability
      MIGRATION_DATABASE_URL: jdbc:mysql://mysql:3306/observability?serverTimezone=UTC
      # 兼容升级本项目早期由 schema.sql 创建的本地持久卷。
      MIGRATION_BASELINE_ON_MIGRATE: "true"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_DATA_STREAM: logs-observability-default
      ELASTICSEARCH_RETENTION: 30d
      GRPC_PORT: 9090
      # 以下凭据仅用于本地 Compose；真实环境必须从密钥管理系统注入。
      SECURITY_READ_ONLY_USERNAME: viewer
      SECURITY_READ_ONLY_PASSWORD: viewer-local
      SECURITY_OPERATOR_USERNAME: operator
      SECURITY_OPERATOR_PASSWORD: operator-local
      SECURITY_ADMIN_USERNAME: admin
      SECURITY_ADMIN_PASSWORD: admin-local
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

volumes:
  mysql-data:
  elasticsearch-data:
